components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        code:
          type: string
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_by:
          type: string
          format: uuid
          nullable: true
        user:
          type: string
          format: uuid
        court:
          type: string
          format: uuid
        sport:
          type: string
          format: uuid
      required:
      - code
      - court
      - created_at
      - end_at
      - hold_expires_at
      - id
      - sport
      - start_at
      - status
      - updated_at
      - user
    Court:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          maxLength: 100
        surface:
          type: string
          maxLength: 100
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        created_by:
          type: string
          format: uuid
          nullable: true
        turf:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - name
      - turf
      - updated_at
    PatchedBooking:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        code:
          type: string
          readOnly: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        hold_expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        created_by:
          type: string
          format: uuid
          nullable: true
        user:
          type: string
          format: uuid
        court:
          type: string
          format: uuid
        sport:
          type: string
          format: uuid
