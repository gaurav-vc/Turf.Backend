          format: uuid
      required:
      - address
      - city
      - created_at
      - id
      - name
      - owner
      - slug
      - updated_at
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
