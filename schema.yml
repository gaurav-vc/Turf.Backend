      description: |-
        * `HOLD` - Hold
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
        * `EXPIRED` - Expired
        * `COMPLETED` - Completed
        * `NO_SHOW` - No Show
    Turf:
